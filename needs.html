<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نیازها | بازانو</title>
<link href="assets/css/font-face.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/fontawesome-7.1.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.page{padding:40px 0 100px}
.card-g{background:rgba(255,255,255,.72);border:1px solid rgba(106,121,100,.16);border-radius:24px;padding:20px;margin-bottom:12px}
.btn_bz{padding:10px 18px;border-radius:50px;background:#6a7964;color:#fff;border:none;cursor:pointer}
.badge-s{display:inline-block;padding:3px 10px;border-radius:16px;font-size:.75rem;background:rgba(106,121,100,.12);color:#6a7964}
input,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid rgba(106,121,100,.2);margin-bottom:8px}
</style>
</head>
<body>
<header style="height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(106,121,100,.12);background:#fff">
<a href="/" style="font-weight:700;color:#6a7964;text-decoration:none">بازانو</a>
<nav style="display:flex;gap:12px;font-size:.9rem">
<a href="/needs.html" style="color:#6a7964">نیازها</a>
<a href="/offers.html" style="color:#727772">خدمات</a>
<a href="/chat.html" style="color:#727772">گفتگو</a>
<a href="/profile/dashboard.html" style="color:#727772">داشبورد</a>
</nav>
</header>
<main class="page"><div class="container">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h1 style="margin:0;font-size:1.4rem">نیازها</h1>
<button class="btn_bz" id="show-form">ثبت نیاز</button>
</div>
<div id="form" class="card-g" style="display:none">
<input id="title" placeholder="عنوان نیاز">
<textarea id="message" rows="3" placeholder="توضیح نیاز"></textarea>
<button class="btn_bz" id="submit">ثبت</button>
</div>
<div id="list">بارگذاری...</div>
</div></main>
<script src="assets/js/bazano-auth.js"></script>
<script>
document.getElementById('show-form').onclick=()=>{
  if(!requireAuth())return;
  document.getElementById('form').style.display='block';
};
document.getElementById('submit').onclick=async()=>{
  try{
    await apiFetch('/needs','POST',{title:document.getElementById('title').value,message:document.getElementById('message').value});
    document.getElementById('form').style.display='none';
    load();
  }catch(e){alert(e.message);}
};
async function load(){
  try{
    const rows=await apiFetch('/needs');
    const statusMap={open:'باز',in_progress:'در حال پیگیری',closed:'بسته'};
    document.getElementById('list').innerHTML=rows.map(n=>`
      <div class="card-g">
        <span class="badge-s">${statusMap[n.status]||n.status}</span>
        <h3 style="margin:8px 0"><a href="/need-details.html?id=${n.id}" style="color:inherit;text-decoration:none">${n.title}</a></h3>
        <p style="color:#727772;margin:0">${(n.message||'').slice(0,120)}</p>
      </div>`).join('')||'<p style="text-align:center;color:#727772">نیازی ثبت نشده</p>';
  }catch(e){document.getElementById('list').textContent=e.message;}
}
load();
</script>
</body></html>
