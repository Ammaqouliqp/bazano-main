<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات خدمت | بازانو</title>
<link href="assets/css/font-face.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/fontawesome-7.1.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.page{padding:40px 0 100px}.card-g{background:rgba(255,255,255,.72);border:1px solid rgba(106,121,100,.16);border-radius:28px;padding:28px;box-shadow:0 10px 28px rgba(31,38,48,.05)}
.badge-s{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.8rem;background:rgba(106,121,100,.12);color:#6a7964}
.btn_bz{display:inline-block;padding:10px 20px;border-radius:50px;background:#6a7964;color:#fff;border:none;text-decoration:none}
</style>
</head>
<body>
<header class="site_header" style="background:rgba(255,255,255,.9);border-bottom:1px solid rgba(106,121,100,.12)">
<div class="container" style="display:flex;justify-content:space-between;align-items:center;height:60px">
<a href="/" style="font-weight:700;color:#6a7964;text-decoration:none">بازانو</a>
<nav style="display:flex;gap:14px;font-size:.9rem">
<a href="/needs.html" style="color:#727772">نیازها</a>
<a href="/offers.html" style="color:#6a7964">خدمات</a>
<a href="/profile/" style="color:#727772">پروفایل</a>
</nav></div></header>
<main class="page"><div class="container"><div id="content" class="card-g">در حال بارگذاری...</div></div></main>
<script src="assets/js/bazano-auth.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
(async()=>{
  try{
    const o=await apiFetch('/offers/'+id);
    const typeMap={product:'محصول',service:'خدمت',skill:'مهارت'};
    document.getElementById('content').innerHTML=`
      <span class="badge-s">${typeMap[o.type]||o.type}</span>
      ${o.category?'<span class="badge-s" style="margin-right:6px">'+o.category+'</span>':''}
      <h1 style="margin:12px 0">${o.title}</h1>
      <p style="color:#727772;white-space:pre-wrap">${o.message||''}</p>
      <div style="margin-top:16px;font-size:.85rem;color:#727772">${o.firstname||''} ${o.lastname||''}</div>
      <div style="margin-top:20px"><a class="btn_bz" href="/offers.html">بازگشت به خدمات</a></div>`;
  }catch(e){document.getElementById('content').textContent=e.message;}
})();
</script>
</body></html>
