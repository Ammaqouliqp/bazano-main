<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خدمات | بازانو</title>
<link href="assets/css/font-face.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/fontawesome-7.1.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.page{padding:40px 0 100px}
.card-g{background:rgba(255,255,255,.72);border:1px solid rgba(106,121,100,.16);border-radius:24px;padding:20px;margin-bottom:12px}
.btn_bz{padding:10px 18px;border-radius:50px;background:#6a7964;color:#fff;border:none;text-decoration:none;display:inline-block}
.badge-s{display:inline-block;padding:3px 10px;border-radius:16px;font-size:.75rem;background:rgba(106,121,100,.12);color:#6a7964}
</style>
</head>
<body>
<header style="height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(106,121,100,.12);background:#fff">
<a href="/" style="font-weight:700;color:#6a7964;text-decoration:none">بازانو</a>
<nav style="display:flex;gap:12px;font-size:.9rem">
<a href="/needs.html" style="color:#727772">نیازها</a>
<a href="/offers.html" style="color:#6a7964">خدمات</a>
<a href="/become-provider.html" style="color:#727772">ارائه‌دهنده شو</a>
</nav>
</header>
<main class="page"><div class="container">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h1 style="margin:0;font-size:1.4rem">خدمات</h1>
<a class="btn_bz" href="/become-provider.html">ارائه‌دهنده شو</a>
</div>
<div id="list">بارگذاری...</div>
</div></main>
<script src="assets/js/bazano-auth.js"></script>
<script>
async function load(){
  try{
    const rows=await apiFetch('/offers');
    const typeMap={product:'محصول',service:'خدمت',skill:'مهارت'};
    document.getElementById('list').innerHTML=rows.map(o=>`
      <div class="card-g">
        <span class="badge-s">${typeMap[o.type]||o.type}</span>
        ${o.category?'<span class="badge-s">'+o.category+'</span>':''}
        <h3 style="margin:8px 0"><a href="/offer-details.html?id=${o.id}" style="color:inherit;text-decoration:none">${o.title}</a></h3>
        <p style="color:#727772">${(o.message||'').slice(0,120)}</p>
        <a class="btn_bz" href="/offer-details.html?id=${o.id}">درخواست / ارتباط</a>
      </div>`).join('')||'<p style="text-align:center;color:#727772">خدمتی ثبت نشده</p>';
  }catch(e){document.getElementById('list').textContent=e.message;}
}
load();
</script>
</body></html>
