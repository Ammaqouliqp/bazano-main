<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پروفایل | بازانو</title>
<link href="../assets/css/font-face.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/fontawesome-7.1.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.page{padding:40px 0 100px}.card-g{background:rgba(255,255,255,.72);border:1px solid rgba(106,121,100,.16);border-radius:24px;padding:28px;max-width:480px;margin:0 auto}
.btn_bz{padding:10px 18px;border-radius:50px;background:#6a7964;color:#fff;border:none;text-decoration:none;display:inline-block;margin:4px}
</style>
</head>
<body>
<header style="height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(106,121,100,.12);background:#fff">
<a href="/" style="font-weight:700;color:#6a7964;text-decoration:none">بازانو</a>
<a href="/profile/dashboard.html" style="color:#727772;text-decoration:none">داشبورد</a>
</header>
<main class="page"><div class="container">
<div class="card-g" id="box">بارگذاری...</div>
</div></main>
<script src="../assets/js/bazano-auth.js"></script>
<script>
if(!requireAuth()){}
(async()=>{
  try{
    const u=await apiFetch('/users/me');
    document.getElementById('box').innerHTML=`
      <h1 style="font-size:1.3rem">پروفایل</h1>
      <p><b>نام:</b> ${u.firstname||'-'} ${u.lastname||''}</p>
      <p><b>ایمیل:</b> ${u.email}</p>
      <p><b>تلفن:</b> ${u.phone||'-'}</p>
      <p><b>نقش:</b> ${u.role}</p>
      <p style="margin-top:20px">
        <a class="btn_bz" href="/profile/dashboard.html">داشبورد</a>
        <a class="btn_bz" href="/chat.html">گفتگو</a>
        <button class="btn_bz" style="background:#999" onclick="logout()">خروج</button>
      </p>`;
  }catch(e){document.getElementById('box').textContent=e.message;}
})();
</script>
</body></html>
