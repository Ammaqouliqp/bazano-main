<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تکمیل پروفایل | بازانو</title>
  <link href="assets/css/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/fontawesome-7.1.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth_page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bz-bg,#f7f7f5)}
    .auth_card{width:100%;max-width:440px;padding:32px 28px;border-radius:28px;border:1px solid rgba(255,255,255,.86);background:rgba(255,255,255,.72);box-shadow:0 14px 36px rgba(31,38,48,.08);backdrop-filter:blur(18px)}
    .auth_card h1{text-align:center;font-size:1.35rem;margin-bottom:8px;color:#242824}
    .auth_card .sub{text-align:center;color:#727772;margin-bottom:24px;font-size:.9rem}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;margin-bottom:6px;font-size:.9rem}
    .form-group input{width:100%;padding:12px 14px;border:1px solid rgba(106,121,100,.16);border-radius:14px;background:rgba(255,255,255,.7);font-family:inherit}
    .btn_auth{width:100%;padding:14px;border:none;border-radius:50px;background:#6a7964;color:#fff;font-size:1rem;cursor:pointer;margin-top:8px}
    .msg{margin-top:14px;text-align:center;font-size:.9rem}
    .msg.error{color:#c0392b}.msg.success{color:#27ae60}
    .logo{text-align:center;font-weight:700;color:#6a7964;font-size:1.5rem;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="auth_page">
    <div class="auth_card">
      <div class="logo">بازانو</div>
      <h1>تکمیل پروفایل</h1>
      <p class="sub">برای فعال شدن حساب، این اطلاعات لازم است</p>
      <div class="form-group">
        <label>نام</label>
        <input type="text" id="firstname" required>
      </div>
      <div class="form-group">
        <label>نام خانوادگی</label>
        <input type="text" id="lastname" required>
      </div>
      <div class="form-group">
        <label>شماره تلفن</label>
        <input type="tel" id="phone" inputmode="numeric" placeholder="09xxxxxxxxx" required>
      </div>
      <button class="btn_auth" id="submit-btn">ثبت و ورود</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script src="assets/js/bazano-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (!token) { location.href = '/login.html'; return; }
      // if already complete, go home
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (!payload.pending && payload.profile_complete) location.href = '/';
      } catch(e) {}

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const firstname = document.getElementById('firstname').value.trim();
        const lastname = document.getElementById('lastname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const msg = document.getElementById('msg');
        if (!firstname || !lastname || !phone) {
          msg.className = 'msg error'; msg.textContent = 'همه فیلدها لازم است';
          return;
        }
        try {
          const data = await apiFetch('/auth/complete-profile', 'POST', { firstname, lastname, phone });
          setToken(data.token);
          msg.className = 'msg success'; msg.textContent = 'ثبت شد';
          setTimeout(() => location.href = '/', 600);
        } catch (err) {
          msg.className = 'msg error'; msg.textContent = err.message;
        }
      });
    });
  </script>
</body>
</html>
